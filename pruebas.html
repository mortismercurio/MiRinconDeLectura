<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contenedor {

            display: flex;
            gap: 10px;
            position: relative;
            background-color: gray;
            height: 8000px;
            margin: 200px;
        }

        .caja {

            width: 120px;
            height: 100px;
            padding: 10px;
            text-align: center;
            
        }
        .roja {

            background-color: red;
            
        

            

            
        }
        .azul {
            background-color:blue;
            position: relative;
            bottom: 30px;
            right: 40px;
            
            
            
            

        }

        .verde {
            background-color: green;

            
            
        }
        .amarilla {
            background-color: yellow;
            
        

        }
        .tarjeta {
            position: relative;
            width: 200px;
            border: 1px solid gray;
            height: 8000px;
        }
        
        .tarjeta img {

            width: 100%;
            display:block;
            position: sticky;
            top: 20px;
            
        }

        .oferta {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: red;
            color: white;
            padding: 8px;
            font-weight: bold

        }
        .boton {
            position: fixed;
            
            top: 40px;

            right: 40px;
            background-color: red;
            font-size: xx-large;
        }





    </style>
</head>
<body>
    <div class="contenedor">

        <div class=" caja roja">caja 1</div>

         <div class=" caja azul">caja 2</div>

          <div class=" caja verde">caja 3</div>

          <div class="caja amarilla">caja 4</div>


    </div>
    <div class="tarjeta">
        <img src="img/HistoriaInterminable.jpg" alt="Producto en Oferta">
        <span class="oferta">OFERTA</span>
    </div>
    <a href="#" class="boton">boton</a>
</body>
</html>
